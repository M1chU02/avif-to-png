<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AVIF to PNG Converter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .container { max-width: 500px; margin: auto; }
  </style>
</head>
<body>
<div class="container">
  <h1>AVIF → PNG (multiple files)</h1>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="avif" accept=".avif" multiple required />
    <br/><br/>
    <button type="submit">Convert All</button>
  </form>
</div>
</body>
</html>
